<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DevJack icon source (original art). The Marketplace needs a PNG: scripts/render-assets.mjs renders media/icon.png. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f8556"/>
      <stop offset=".6" stop-color="#0e5233"/>
      <stop offset="1" stop-color="#06301d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset=".5" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#8c6a22"/>
    </linearGradient>
    <pattern id="lattice" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#20304f"/>
      <path d="M0 7h14M7 0v14" stroke="#34497a" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#felt)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- back card -->
  <g transform="translate(-16 2) rotate(-16 104 128)" filter="url(#shadow)">
    <rect x="52" y="52" width="104" height="146" rx="12" fill="#f7f3ea"/>
    <rect x="60" y="60" width="88" height="130" rx="8" fill="url(#lattice)"/>
    <circle cx="104" cy="125" r="22" fill="#1a2742" stroke="url(#gold)" stroke-width="3"/>
    <text x="104" y="133" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="22" fill="url(#gold)">DJ</text>
  </g>

  <!-- front card: ace of spades -->
  <g transform="translate(8 0) rotate(10 150 132)" filter="url(#shadow)">
    <rect x="98" y="58" width="104" height="146" rx="12" fill="#fffdf8" stroke="#cfc6b3" stroke-width="2"/>
    <text x="112" y="88" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="26" fill="#1d1d22">A</text>
    <path transform="translate(117 98) scale(.62)" d="M50 4c13 19 44 34 44 57 0 14-10 22-22 22-8 0-15-4-18-11 1 10 5 17 13 24H33c8-7 12-14 13-24-3 7-10 11-18 11C16 83 6 75 6 61 6 38 37 23 50 4z" fill="#1d1d22"/>
  </g>

  <!-- chip -->
  <g transform="translate(186 186)" filter="url(#shadow)">
    <circle r="34" fill="#b8322d"/>
    <circle r="28" fill="none" stroke="#f4e9d8" stroke-width="9" stroke-dasharray="11 11" transform="rotate(-8)"/>
    <circle r="19" fill="#b8322d" stroke="#f4e9d8" stroke-width="2"/>
    <circle r="34" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/>
  </g>
</svg>
